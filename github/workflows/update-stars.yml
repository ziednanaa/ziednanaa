name: Update Starred Repos

on:
  schedule:
    - cron: "0 1 45 * *"    # täglich um 01:45 UTC
  workflow_dispatch:

jobs:
  update-stars:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch starred repos
        run: |
          curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          "https://api.github.com/users/${{ github.repository_owner }}/starred?per_page=100" \
          | jq -r '.[] | "- [" + .full_name + "](" + .html_url + ") — ⭐ " + (.stargazers_count|tostring)' > stars.md

      - name: Replace README section
        run: |
          awk '
            BEGIN {in=0}
            /<!-- STARRED-REPOS:START -->/ {print;print "";system("cat stars.md");in=1;next}
            /<!-- STARRED-REPOS:END -->/ {in=0}
            in==0 {print}
          ' README.md > README.new
          mv README.new README.md

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
          else
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "Update starred repositories"
            git push
          fi
